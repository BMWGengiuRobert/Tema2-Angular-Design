<div class="avatar-frame">
    <div class="user">
        <div class="name-initials" [ngStyle]="{'background-color': selectedUser.color}">
            {{ getInitialsAvatar(selectedUser.firstName, selectedUser.lastName) }}
        </div>
        <div class="user-info">
            <p class="user-info__full-name">{{ selectedUser.firstName }} {{ selectedUser.lastName }}</p>
            <p class="user-info__status">Online</p>
        </div>
    </div>
    <button class="dropdown-button" (click)="onClickShowDropdown()">

        @if(isDropdownVisible) {
            <i class="fa fa-chevron-up"></i>
        }@else{
            <i class="fa fa-chevron-down"></i>
        }

    </button>
    <div class="dropdown-wrapper" *ngIf="isDropdownVisible">
        <app-users-dropdown [selectedUserId]="selectedUser.id"
            (userSelected)="onUserSelected($event) "></app-users-dropdown>
    </div>
</div>
