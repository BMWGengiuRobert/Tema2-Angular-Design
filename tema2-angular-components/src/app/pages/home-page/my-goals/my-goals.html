<div class="card-container">
    <div class="card-container__header">
        <div class="title">
            <span i18n><i class="fa fa-chart-pie"></i> My Goals</span>
        </div>
    </div>
    <div class="card-container__body">
        @if(goals.length === 0) {
        <p i18n class="no-goals">No goals available.</p>
        }

        @for(goal of goals; track goal.id) {
        <div class="item">
            <div class="item__details">
                <span i18n class="item__details__title">{{ goal.name | translate }}</span>
                <div>
                    <span>{{ getProjectNameById(goal.projectId) | translate }}</span>
                    <span>&bull;</span>
                    <span i18n>My Projects</span>
                </div>
            </div>
            <div class="item__status">
                <div class="progress-track">
                    <div class="progress-fill" style="width: {{ goal.percentageCompleted }}%" [ngClass]="{
                        'red': goal.percentageCompleted < 30,
                        'orange': goal.percentageCompleted >= 30 && goal.percentageCompleted < 70,
                        'green': goal.percentageCompleted >= 70,
                        'cyan': goal.percentageCompleted === 100
                    }"></div>
                </div>
                <span class="percentage">{{ goal.percentageCompleted }}%</span>
            </div>
        </div>
        }
    </div>
</div>
