<div class="card-container">
    <div class="card-container__header">
        <div class="title">
            <span><i class="fa fa-stopwatch"></i> My Reminders</span>
        </div>
    </div>
    <div class="card-container__date">
        <span><i class="fa fa-calendar"></i></span>
        <input type="date" [value]="dateInputValue()" (change)="onDateChange($event)" class="date-picker">
        <span>{{ isToday() ? 'Today' : (selectedDate | customDatePipe) }}</span>
        <span>&bull;</span>
        <span>{{reminders.length}}</span>
    </div>
    <div class="card-container__body">
        @if(reminders.length === 0) {
        <p class="no-reminders">No reminders available.</p>
        }

        @for(reminder of reminders; track reminder.id) {
        <div class="item">
            <div class="item__details">
                <span class="item__details__title">{{ reminder.name }}</span>
            </div>
            <div class="item__status">
                <span><i class="fa fa-bell"></i></span>
                <span><i class="fa fa-trash"></i></span>
                <span><i class="fa fa-check"></i></span>
            </div>
        </div>
        }
    </div>
</div>
