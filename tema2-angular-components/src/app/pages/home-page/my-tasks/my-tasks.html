<div class="overlay">
    <div class="card-container">
        <div class="card-container__header">
            <div class="title">
                <span><i class="fa fa-list"></i> My Tasks</span>
            </div>
            <div class="actions">
                <button><i class="fa fa-plus"></i></button>
                <button><i class="fa fa-maximize"></i></button>
                <button>&bull; &bull; &bull;</button>
            </div>
        </div>
        <div class="card-container__body">
            @if(tasks.length > 0){
            <div class="label">
                <span><i class="fa-solid fa-chevron-up"></i></span>
                <span class="status">IN PROGRESS</span>
                <span>&bull;</span>
                <span>{{tasks.length}} tasks</span>
            </div>
            <div class="card-container__task-list">
                <div class="header">
                    <p>Name</p>
                    <div>
                        <p>Priority</p>
                        <p>Due Date</p>
                    </div>
                </div>
                <div class="tasks">
                    @for(task of tasks; track task.id){
                    <div class="item">
                        <div class="left">
                            <span><i class="fa-solid fa-chevron-down"></i></span>
                            <div></div>
                            <span>{{task.name}}</span>
                        </div>
                        <div class="right">
                            <span class="priority p-{{task.priority.toLowerCase()}}">{{task.priority}}</span>
                            <span>{{task.dueDate | taskDueDatePipe}}</span>
                        </div>
                    </div>
                    }
                </div>
            </div>
            }
            @else {
            <p class="no-tasks">No tasks assigned.</p>
            }
        </div>
        @if(tasks.length > 0){
        <div class="card-container__footer">
            <button class="add_task">+ Add Task</button>
            <div class="item">
                <div class="card">
                    <span><i class="fa fa-chevron-down"></i></span>
                    <span class="p-low">TO DO</span>
                    <span>&bull;</span>
                    <span>1 task</span>
                </div>
            </div>
            <div class="item">
                <div class="card">
                    <span><i class="fa fa-chevron-down"></i></span>
                    <span class="p-medium">UPCOMING</span>
                    <span>&bull;</span>
                    <span>1 task</span>
                </div>
            </div>
        </div>
        }
    </div>
</div>
