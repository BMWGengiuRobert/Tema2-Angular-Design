<ul class="routes-list">
    <li class="route-item" *ngFor="let route of routes">
        <a [routerLink]="[route.path]" class="route-link" (mouseenter)="hoveredRouteId = route.id"
            (mouseleave)="hoveredRouteId = null">
            <i class="{{ route.icon }}" [ngStyle]="{'color': hoveredRouteId === route.id ? selectedUserColor : ''}"></i>
            {{ ('SIDEBAR.ROUTES_LIST.' + route.id) | translate }}
        </a>
    </li>
</ul>
