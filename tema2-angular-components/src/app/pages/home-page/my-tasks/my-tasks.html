<div class="overlay">
    <div class="card-container">
        <div class="card-container__header">
            <div class="title">
                <span><i class="fa fa-list"></i> My Tasks</span>
            </div>
            <div class="actions">
                <button><i class="fa fa-plus"></i></button>
                <button><i class="fa fa-maximize"></i></button>
                <button>&bull; &bull; &bull;</button>
            </div>
        </div>
        <div class="card-container__body">
            <div class="label">
                <span><i class="fa-solid fa-chevron-up"></i></span>
                <span class="status">IN PROGRESS</span>
                <span>&bull;</span>
                <span>2 tasks</span>
            </div>
            <div class="card-container__task-list">
                <div class="header">
                    <p>Name</p>
                    <div>
                        <p>Priority</p>
                        <p>Due Date</p>
                    </div>
                </div>
                <div class="tasks">
                    <div class="item">
                        <div class="left">
                            <span><i class="fa-solid fa-chevron-down"></i></span>
                            <div></div>
                            <span>One-on-One Meeting</span>
                        </div>
                        <div class="right">
                            <span class="priority p-high">High</span>
                            <span class="high">Today</span>
                        </div>
                    </div>
                    <div class="item">
                        <div class="left">
                            <span><i class="fa-solid fa-chevron-down"></i></span>
                            <div></div>
                            <span>Send a summary email to stakeholders</span>
                        </div>
                        <div class="right">
                            <span class="priority p-low">Low</span>
                            <span>3 days left</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-container__footer">
            <button>+ Add Task</button>
            <div class="item">
                <div class="card">
                    <span><i class="fa fa-chevron-down"></i></span>
                    <span class="p-low">TO DO</span>
                    <span>&bull;</span>
                    <span>1 task</span>
                </div>
            </div>
            <div class="item">
                <div class="card">
                    <span><i class="fa fa-chevron-down"></i></span>
                    <span class="p-medium">UPCOMING</span>
                    <span>&bull;</span>
                    <span>1 task</span>
                </div>
            </div>
        </div>
    </div>
</div>
