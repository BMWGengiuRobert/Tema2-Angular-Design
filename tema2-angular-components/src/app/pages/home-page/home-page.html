<div class="page-container">
    <p class="page-container__date">{{ currentDate | customDatePipe }}</p>
    <div class="page-container__header">
        <div class="page-container__header__messages">
            <span class="page-container__header__messages__greetings">Hello, {{ selectedUser.firstName }}!</span>
            <span class="page-container__header__messages__help">How can I help you today?</span>
        </div>
        <div class="page-container__header__buttons">
            <button class="ask-ai"><span class="icon">&#9733;</span> Ask AI</button>
            <div class="page-container__header__buttons__gradient">
                <button>Get tasks updates</button>
            </div>
            <div class="page-container__header__buttons__gradient">
                <button>Create workspace</button>
            </div>
            <div class="page-container__header__buttons__gradient">
                <button>Connect apps</button>
            </div>
        </div>
    </div>
    <div class="page-container__main-section">
        <div class="page-container__left-section">
            <app-my-tasks></app-my-tasks>
            <app-my-goals></app-my-goals>
        </div>
        <div class="page-container__right-section">
            <app-projects-card></app-projects-card>
            <app-calendar-card></app-calendar-card>
            <app-my-reminders></app-my-reminders>
        </div>
    </div>
</div>
